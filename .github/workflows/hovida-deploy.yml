name: HOVIDA deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hovida-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Helper
        run: |
          cat > /tmp/run.sh <<'SH'
          #!/bin/bash
          out=$("$@" 2>&1); code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            msg=$(echo "$out" | tail -25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=cmd failed::$msg"
          fi
          exit $code
          SH
          chmod +x /tmp/run.sh
      - name: Build
        run: npm run build:cloudflare
      - name: Ensure D1 database in this account
        run: |
          /tmp/run.sh npx wrangler d1 list --json > /tmp/d1.json || true
          ID=$(python3 - <<'PY'
          import json,re
          t=open('/tmp/d1.json').read()
          try:
              d=json.loads(t[t.index('['):t.rindex(']')+1])
          except Exception: d=[]
          print(next((x['uuid'] for x in d if x['name']=='hovida-preview'),''))
          PY
          )
          if [ -z "$ID" ]; then
            /tmp/run.sh npx wrangler d1 create hovida-preview --location weur > /tmp/d1create.txt
            ID=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/d1create.txt | head -1)
          fi
          echo "D1 id: $ID"
          sed -i -E "s/\"database_id\": \"[0-9a-f-]+\"/\"database_id\": \"$ID\"/" wrangler.jsonc
          grep database_id wrangler.jsonc
      - name: Apply D1 migrations
        run: /tmp/run.sh npx wrangler d1 migrations apply DB --remote
      - name: Ensure workers.dev subdomain
        run: |
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain
          CUR=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" $API)
          SUB=$(echo "$CUR" | python3 -c "import sys,json;d=json.load(sys.stdin);print((d.get('result') or {}).get('subdomain') or '')")
          if [ -z "$SUB" ]; then
            for name in omidadli omidadli-apps omidadli01 omid-adli-hovida; do
              R=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" $API -d "{\"subdomain\":\"$name\"}")
              SUB=$(echo "$R" | python3 -c "import sys,json;d=json.load(sys.stdin);print((d.get('result') or {}).get('subdomain') or '')")
              [ -n "$SUB" ] && break
              echo "try $name failed: $R"
            done
          fi
          if [ -z "$SUB" ]; then echo "::error title=subdomain::$CUR"; exit 1; fi
          echo "workers.dev subdomain: $SUB"
      - name: Free plan - deploy without Container
        if: ${{ vars.USE_CONTAINER != 'true' }}
        run: |
          python3 - <<'PY'
          t=open('wrangler.jsonc').read()
          i=t.index('"containers"')
          j=t.index('[',i); d=0
          for k in range(j,len(t)):
              if t[k]=='[': d+=1
              elif t[k]==']':
                  d-=1
                  if d==0: break
          end=k+1
          if t[end]==',': end+=1
          t=t[:i]+t[end:]
          open('wrangler.jsonc','w').write(t)
          PY
          grep -c '"containers"' wrangler.jsonc || true
      - name: Deploy Worker + Container
        run: /tmp/run.sh npx wrangler deploy --var BACKEND_URL:https://hovida-api.onrender.com
      - name: Set secrets
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          STORAGE_TOKEN: ${{ secrets.STORAGE_TOKEN }}
        run: |
          printf '%s' "$STORAGE_TOKEN" | npx wrangler secret put STORAGE_TOKEN
          printf '%s' "$APP_SECRET" | npx wrangler secret put APP_SECRET
          if [ -n "$ADMIN_EMAILS" ]; then printf '%s' "$ADMIN_EMAILS" | npx wrangler secret put ADMIN_EMAILS; fi
      - name: Smoke test
        run: |
          U=https://hovida.omidadli.workers.dev
          for i in 1 2 3 4 5 6 7 8; do
            C=$(curl -s -o /tmp/h -w "%{http_code}" $U/api/health); [ "$C" = 200 ] && break; sleep 10
          done
          echo "::notice title=api health::$C $(head -c 300 /tmp/h)"
          C=$(curl -s -o /tmp/b -w "%{http_code}" $U/); echo "::notice title=home::$C"
          S=$(curl -s -o /tmp/s -w "%{http_code}" $U/_storage/v1/usage); echo "::notice title=storage no token::$S"
