name: HOVIDA deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hovida-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Helper
        run: |
          cat > /tmp/run.sh <<'SH'
          #!/bin/bash
          out=$("$@" 2>&1); code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            msg=$(echo "$out" | tail -25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=cmd failed::$msg"
          fi
          exit $code
          SH
          chmod +x /tmp/run.sh
      - name: Build
        run: npm run build:cloudflare
      - name: Apply D1 migrations
        run: /tmp/run.sh npx wrangler d1 migrations apply DB --remote
      - name: Deploy Worker + Container
        run: /tmp/run.sh npx wrangler deploy
      - name: Set secrets
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          printf '%s' "$APP_SECRET" | npx wrangler secret put APP_SECRET
          if [ -n "$ADMIN_EMAILS" ]; then printf '%s' "$ADMIN_EMAILS" | npx wrangler secret put ADMIN_EMAILS; fi
