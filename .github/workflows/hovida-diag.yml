name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          B=https://api.cloudflare.com/client/v4
          enc() { sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          m() { echo "::notice title=$1::$(echo "$2" | head -c 1200 | enc)"; }
          m verify "$(curl -s -H "Authorization: Bearer $T" $B/accounts/$A/tokens/verify)"
          m subdomain "$(curl -s -H "Authorization: Bearer $T" $B/accounts/$A/workers/subdomain)"
          m containers_me "$(curl -s -i -H "Authorization: Bearer $T" $B/accounts/$A/containers/me)"
          m cloudchamber "$(curl -s -i -H "Authorization: Bearer $T" $B/accounts/$A/cloudchamber/me)"
          m account "$(curl -s -H "Authorization: Bearer $T" $B/accounts/$A | head -c 400)"
          m subs "$(curl -s -H "Authorization: Bearer $T" $B/accounts/$A/subscriptions | python3 -c "import sys,json;d=json.load(sys.stdin);print([ (x.get('rate_plan') or {}).get('public_name') for x in d.get('result',[])] if d.get('success') else d)")"
