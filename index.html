<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>هویدا — تحلیل هوشمند رزومه</title>
    <meta name="description" content="هویدا: تحلیل هوشمند رزومه‌ها برای تصمیم‌های بهتر در منابع انسانی. معیارهای اختصاصی هر فرصت شغلی، شواهد از متن رزومه، مقایسه کاندیداها، بانک استعداد و گزارش‌ها — فارسی و شمسی." />
    <meta property="og:title" content="هویدا — آنچه مهم است، روشن می‌شود." />
    <meta property="og:description" content="تحلیل هوشمند رزومه‌ها برای تصمیم‌های بهتر در منابع انسانی." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/hovida-app-icon.svg" />
    <meta name="theme-color" content="#F7F8F7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="هویدا" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/hovida-app-icon.svg" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Vazirmatn-var.woff2" crossorigin />

    <!--
      Critical CSS — deliberately plain (no @layer / color-mix) so the boot
      screen and the fatal-error card render even where the bundled Tailwind v4
      CSS is unsupported (old iOS Safari). No third-party origins.
    -->
    <style>
      @font-face {
        font-family: 'Vazirmatn';
        src: url('/fonts/Vazirmatn-var.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      html, body { background: #F7F8F7; }
      body {
        margin: 0;
        color: #252C28;
        font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Tahoma, sans-serif;
        line-height: 1.7;
        min-height: 100vh;
      }
      #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #F7F8F7;
        direction: rtl;
        transition: opacity 0.25s ease-out;
      }
      #boot-screen.boot-fade-out { opacity: 0; pointer-events: none; }
      .boot-mark { width: 52px; height: 52px; animation: boot-breathe 1.6s ease-in-out infinite alternate; }
      .boot-bar { width: 120px; height: 3px; border-radius: 999px; background: #E5E7EB; overflow: hidden; }
      .boot-bar span { display: block; width: 40%; height: 100%; border-radius: 999px; background: #2DBA4E; animation: boot-slide 1.1s ease-in-out infinite; }
      .boot-text { font-size: 13px; font-weight: 600; color: #6B746F; }
      @keyframes boot-breathe { from { transform: scale(0.97); opacity: 0.85; } to { transform: scale(1.03); opacity: 1; } }
      @keyframes boot-slide { 0% { transform: translateX(140%); } 100% { transform: translateX(-260%); } }
      @media (prefers-reduced-motion: reduce) { .boot-mark, .boot-bar span { animation: none; } }

      /* Shown instead of a silent blank page when JS/CSS cannot run. */
      #boot-fatal {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #F7F8F7;
        direction: rtl;
      }
      #boot-fatal.boot-shown { display: flex; }
      #boot-fatal .card {
        max-width: 460px;
        width: 100%;
        background: #fff;
        border: 1px solid #E5E7EB;
        border-radius: 16px;
        padding: 22px;
        box-shadow: 0 18px 40px -12px rgba(20, 30, 24, 0.22);
      }
      #boot-fatal h1 { font-size: 16px; margin: 0 0 8px; color: #252C28; }
      #boot-fatal p { font-size: 13px; margin: 0 0 12px; color: #4B5550; }
      #boot-fatal code {
        display: block;
        direction: ltr;
        text-align: left;
        font-size: 11px;
        background: #F3F4F3;
        border-radius: 8px;
        padding: 8px;
        margin: 0 0 14px;
        color: #6B746F;
        word-break: break-word;
        max-height: 90px;
        overflow: auto;
      }
      #boot-fatal button {
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        color: #fff;
        background: #1B8539;
        border: 0;
        border-radius: 10px;
        padding: 10px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="boot-screen" role="status" aria-live="polite">
      <svg class="boot-mark" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="-0.8 -0.5 100 101"><defs><linearGradient id="bootL" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#1D7A34"/><stop offset="0.6" stop-color="#28A045"/><stop offset="1" stop-color="#3CC05B"/></linearGradient><linearGradient id="bootR" x1="0.2" y1="1" x2="0.9" y2="0"><stop offset="0" stop-color="#3CC05B"/><stop offset="0.45" stop-color="#2DAA4B"/><stop offset="1" stop-color="#1D7A34"/></linearGradient><filter id="bootS" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="-0.6" dy="1.4" stdDeviation="1.6" flood-color="#0E3B1B" flood-opacity="0.28"/></filter></defs><path d="M0.00 25.00 A25.00 25.00 0 0 1 25.00 0.00 L40.80 0.00 A2.60 2.60 0 0 1 43.40 2.60 L43.40 43.00 L24.30 43.00 L24.30 88.00 A12.00 12.00 0 0 1 12.30 100.00 L4.00 100.00 A4.00 4.00 0 0 1 0.00 96.00 Z" fill="url(#bootL)"/><path d="M57.20 20.00 A20.00 20.00 0 0 1 77.20 0.00 L94.40 0.00 A4.00 4.00 0 0 1 98.40 4.00 L98.40 68.00 A32.00 32.00 0 0 1 66.40 100.00 L46.40 100.00 A4.00 4.00 0 0 1 42.40 96.00 L42.40 46.00 L57.20 46.00 Z" fill="url(#bootR)"/><path d="M52.60 14.80 C63.03 34.26 61.34 32.57 80.80 43.00 C61.34 53.43 63.03 51.74 52.60 71.20 C42.17 51.74 43.86 53.43 24.40 43.00 C43.86 32.57 42.17 34.26 52.60 14.80 Z" fill="#FFFFFF" filter="url(#bootS)"/></svg>
      <div class="boot-bar"><span></span></div>
      <div class="boot-text">هویدا در حال آماده‌سازی…</div>
    </div>

    <div id="boot-fatal">
      <div class="card">
        <h1>هویدا روی این مرورگر اجرا نشد</h1>
        <p>
          اگر از آیفون یا آیپد استفاده می‌کنید، iOS را به نسخه ۱۶.۴ یا بالاتر به‌روزرسانی کنید
          (Settings › General › Software Update) یا سایت را در کروم باز کنید.
        </p>
        <code id="boot-fatal-detail"></code>
        <button type="button" onclick="location.reload()">تلاش دوباره</button>
      </div>
    </div>

    <script>
      // Any uncaught failure during boot must be visible — never a silent blank page.
      (function () {
        var boot = document.getElementById('boot-screen');
        var fatal = document.getElementById('boot-fatal');
        var detail = document.getElementById('boot-fatal-detail');
        var failed = false;
        var watchdog = null;

        function hideBoot() {
          if (watchdog) { clearTimeout(watchdog); watchdog = null; }
          if (boot) {
            boot.classList.add('boot-fade-out');
            setTimeout(function () { if (boot && boot.parentNode) boot.parentNode.removeChild(boot); }, 260);
          }
        }

        function mounted() {
          var root = document.getElementById('root');
          return root && root.childElementCount > 0;
        }

        function showFatal(message) {
          if (mounted() || failed) return;
          failed = true;
          hideBoot();
          if (detail) detail.textContent = String(message || 'خطای نامشخص');
          if (fatal) fatal.className = 'boot-shown';
        }

        window.__hovidaBoot = { hide: hideBoot, fail: showFatal };
        window.addEventListener('error', function (e) {
          if (mounted()) return;
          showFatal((e && (e.message || (e.error && e.error.message))) || 'خطای ناشناخته');
        });
        window.addEventListener('unhandledrejection', function (e) {
          if (mounted()) return;
          var r = e && e.reason;
          showFatal((r && (r.message || r)) || 'خطای ناشناخته');
        });
        watchdog = setTimeout(function () {
          if (!mounted()) showFatal('بارگذاری برنامه بیش از حد طول کشید؛ اتصال اینترنت را بررسی یا صفحه را دوباره بارگذاری کنید.');
        }, 60000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
