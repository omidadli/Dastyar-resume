<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>آفلاین — هویدا</title>
    <meta name="theme-color" content="#F7F8F7" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      @font-face {
        font-family: 'Vazirmatn';
        src: url('/fonts/Vazirmatn-var.woff2') format('woff2');
        font-weight: 100 900;
        font-display: swap;
      }
      html,
      body {
        margin: 0;
        background: #f7f8f7;
        color: #1d2721;
        font-family: 'Vazirmatn', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #fff;
        border: 1px solid #e3e7e4;
        border-radius: 18px;
        padding: 28px 24px;
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        display: block;
      }
      h1 {
        font-size: 17px;
        margin: 0 0 8px;
      }
      p {
        font-size: 13px;
        line-height: 1.9;
        color: #5a6560;
        margin: 0 0 18px;
      }
      button {
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        color: #fff;
        background: #176f30;
        border: 0;
        border-radius: 12px;
        padding: 10px 20px;
        cursor: pointer;
      }
      small {
        display: block;
        margin-top: 14px;
        font-size: 11.5px;
        color: #8b948f;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <img class="mark" src="/brand/hovida-app-icon.svg" alt="" width="56" height="56" />
        <h1>اتصال اینترنت قطع است</h1>
        <p>
          هویدا برای دیدن رزومه‌ها و ثبت تصمیم به سرور وصل می‌شود؛ این صفحه فقط پوستهٔ برنامه است. وقتی اینترنت برگشت،
          همان‌جایی که بودید ادامه می‌دهید.
        </p>
        <button onclick="location.reload()">تلاش دوباره</button>
        <small>هیچ اطلاعاتی از کارجویان روی این دستگاه ذخیره نمی‌شود.</small>
      </div>
    </main>
  </body>
</html>
