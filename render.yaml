# Render Blueprint — HOVIDA (هویدا)
# Data lives on the service disk (data/hovida-store.json + data/resumes/).
# The mounted disk below is required, otherwise every deploy wipes all workspaces.
#
# NOTE: the service and disk names are intentionally unchanged from the earlier
# deployment, so syncing this blueprint keeps the existing disk (and its data).
# For a brand-new deployment you can rename them, e.g. `hovida` / `hovida-data`.

services:
  - type: web
    name: seilaneh-resume-screener
    env: node
    plan: starter
    region: oregon
    runtime: node
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: seilaneh-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: APP_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: DISABLE_DEMO
        sync: false
      - key: LEGACY_OWNER_EMAIL
        sync: false
